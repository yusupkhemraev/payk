version: 2

project_name: payk

builds:
  - main: ./cmd/payk
    binary: payk
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# Replace existing assets so a re-run of a failed release job is idempotent.
release:
  mode: replace

changelog:
  use: github-native

homebrew_casks:
  - name: payk
    repository:
      owner: yusupkhemraev
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/yusupkhemraev/payk
    description: Keyboard-first TUI HTTP client
    commit_author:
      name: goreleaser-bot
      email: noreply@goreleaser.com
    # Release binaries are not notarized; strip the quarantine flag so
    # Gatekeeper does not block the installed binary.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/payk"]
          end
